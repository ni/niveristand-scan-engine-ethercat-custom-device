trigger:
  batch: true
  branches:
    include:
      - main
      - release/*

variables:
  - name: ConvertNetCore
    value: false

resources:
  repositories:
    - repository: niveristand-custom-device-build-tools
      type: github
      ref: main
      endpoint: nivs-custom-devices
      name: ni/niveristand-custom-device-build-tools

  pipelines:
    - pipeline: FxpLibraries
      source: ni.niveristand-scan-engine-fxp-libraries
      trigger:
        branches:
          include:
            - main

    - pipeline: ModuleLibraries
      source: ni.niveristand-scan-engine-module-libraries
      trigger:
        branches:
          include:
            - main

stages:
  # =====================================================================
  # LINUX BUILD
  # =====================================================================
  - template: azure-templates/linux-stage.yml@niveristand-custom-device-build-tools
    parameters:
      stageName: LinuxBuild

      lvVersionsToBuild:
        - version: '2027'
          bitness: '64bit'

      buildSteps:
        - id: 'config_linux_release_scan_engine'
          projectLocation: 'Custom Device Source\Scan Engine.lvproj'
          buildOperation: 'ExecuteBuildSpec'
          target: 'My Computer'
          buildSpec: 'Configuration(Linux) Release'

      releaseVersion: '27.0.0'
      branch: 'main'
      debugBuild: 'no'
      buildOutputLocation: 'Built'
      archiveLocation: '\\nirvana\Measurements\VeriStandAddons\netcore\scan_engine_custom_device'
      repoName: 'niveristand-scan-engine-ethercat-custom-device'